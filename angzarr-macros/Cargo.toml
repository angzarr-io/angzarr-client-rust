[package]
name = "angzarr-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for angzarr OO-style component definitions"
license = "Apache-2.0 OR BSD-3-Clause"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
